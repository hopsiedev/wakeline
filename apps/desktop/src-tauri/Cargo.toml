[package]
name = "wakeline-app"
default-run = "wakeline-app"
description = "Wakeline desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "wakeline_app"
crate-type = ["rlib"]
# Sin pruebas propias: su binario de pruebas no arranca en Windows sin el manifiesto
# de la app (lo necesitan la bandeja y los menús). La lógica se prueba en wakeline-core.
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
tempfile = "3.27.0"
semver = "1.0"
serde.workspace = true
serde_json.workspace = true
time = "0.3.55"
dunce = "1.0.5"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
wakeline-core.workspace = true
tauri-plugin-updater = "2.14.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Credentials", "Win32_Foundation"] }
tauri-winrt-notification = "0.8.1"
windows = { version = "0.62.2", features = ["Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[target."cfg(not(windows))".dependencies]
tauri-plugin-dialog = "2"
