[workspace]
resolver = "3"
members = [
    "crates/wakeline-core",
    "crates/wakeline-cli",
    "crates/wakeline-mcp",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hopsiedev/wakeline"
authors = ["The Wakeline contributors"]

[workspace.dependencies]
wakeline-core = { path = "crates/wakeline-core" }
wakeline-mcp = { path = "crates/wakeline-mcp" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
codegen-units = 1
lto = true
strip = true
