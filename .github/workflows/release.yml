# Manual runs only build review artifacts. Tags create a draft, never a public release.
# Initial packages use manual updates and need no signing secrets.
name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/packages.yml
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: release-packages
      - name: Create review draft from the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          test "$TAG" = "v$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          mapfile -t assets < <(find release-packages -type f \( -name '*.zip' -o -name '*.sha256' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' -o -name SHA256SUMS -o -name 'build-info-*.json' \))
          test "${#assets[@]}" -gt 0
          gh release create "$TAG" "${assets[@]}" --verify-tag --target "$COMMIT" --draft --title "Wakeline $TAG - Windows and Linux" --notes-file RELEASE.md
